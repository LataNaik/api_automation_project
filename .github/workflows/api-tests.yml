name: API Tests

on:
  push:
    branches: [main, product]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allows manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create output directory
        run: mkdir -p output reports

      - name: Run API tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TENANTID: ${{ secrets.TENANTID }}
          USERTYPE: ${{ secrets.USERTYPE }}
          CLIENT_AUTH_HEADER: ${{ secrets.CLIENT_AUTH_HEADER }}
          SEARCH_LIMIT: ${{ secrets.SEARCH_LIMIT }}
          SEARCH_OFFSET: ${{ secrets.SEARCH_OFFSET }}
          HIERARCHYTYPE: ${{ secrets.HIERARCHYTYPE }}
          BOUNDARY_TYPE: ${{ secrets.BOUNDARY_TYPE }}
          BOUNDARY_CODE: ${{ secrets.BOUNDARY_CODE }}
          SERVICE_INDIVIDUAL: ${{ secrets.SERVICE_INDIVIDUAL }}
          SERVICE_PROJECT: ${{ secrets.SERVICE_PROJECT }}
          SERVICE_MDMS: ${{ secrets.SERVICE_MDMS }}
        run: |
          pytest tests/ -v --html=reports/report.html --self-contained-html --junitxml=reports/junit.xml

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: reports/
          retention-days: 30

      - name: Upload test results to GitHub
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results
          path: reports/junit.xml

      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/

  deploy:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
